<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank you — Bilingual Agents</title>
<meta name="description" content="Thanks for your details — redirecting you to our calendar to book your free role call.">
<style>
  :root{ --ink:#1a1a1a; --muted:#5b5b5b; --accent:#c2410c; --line:#e6e3dd; --bg:#fbfaf8; --good:#15803d; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;font-size:16px;min-height:100vh;display:flex;flex-direction:column}
  .wrap{max-width:620px;margin:0 auto;padding:28px 22px 60px;width:100%;flex:1;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 26px;border-bottom:1px solid var(--line)}
  header img{height:30px;width:auto;display:block}
  header a.home{color:var(--muted);text-decoration:none;font-size:.9rem}
  header a.home:hover{color:var(--accent)}
  .card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 0}
  .ok-ring{width:74px;height:74px;border-radius:50%;background:rgba(21,128,61,.1);color:var(--good);display:flex;align-items:center;justify-content:center;margin:0 0 24px}
  .ok-ring svg{width:36px;height:36px}
  h1{font-size:1.9rem;letter-spacing:-.02em;margin:0 0 12px}
  p.sub{font-size:1.08rem;color:var(--muted);margin:0 0 8px;max-width:44ch}
  .spinner{margin:22px 0 26px;width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:1rem;padding:14px 26px;border-radius:10px;transition:transform .15s ease,box-shadow .15s ease;box-shadow:0 4px 14px rgba(194,65,12,.24)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(194,65,12,.3)}
  .fine{margin-top:16px;font-size:.85rem;color:var(--muted)}
  footer{max-width:620px;margin:0 auto;padding:22px 22px 30px;color:var(--muted);font-size:.85rem;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;width:100%}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--accent)}
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NQF7H8QS"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="wrap">
  <header>
    <a href="/" aria-label="Bilingual Agents home"><img src="/logo.png" alt="Bilingual Agents"></a>
    <a class="home" href="/" id="back-link">&larr; Back to site</a>
  </header>

  <div class="card">
    <div class="ok-ring" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4.5 12.5l5 5L19.5 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1 id="t-head">Thank you — we've got your details.</h1>
    <p class="sub" id="t-sub">Redirecting you to our calendar so you can pick a time for your free 15-minute role call…</p>
    <div class="spinner" aria-hidden="true"></div>
    <a class="btn" id="cal-btn" href="#" rel="noopener">Go to the calendar now &rarr;</a>
    <p class="fine" id="t-fine">Not redirected automatically? Tap the button above.</p>
  </div>
</div>
<footer>
  <span>&copy; <span id="y"></span> Bilingual Agents Group</span>
  <a href="/privacy" id="f-priv">Privacy</a>
  <a href="/terms" id="f-terms">Terms</a>
</footer>

<script>
(function(){
  document.getElementById('y').textContent = new Date().getFullYear();

  /* language — shares the ba_lang the main site stores in localStorage */
  var lang = "en";
  try { var s = localStorage.getItem("ba_lang"); if (s === "es" || s === "en") lang = s; } catch(e){}
  var COPY = {
    en: {
      head: "Thank you — we've got your details.",
      sub:  "Redirecting you to our calendar so you can pick a time for your free 15-minute role call…",
      btn:  "Go to the calendar now →",
      fine: "Not redirected automatically? Tap the button above.",
      back: "← Back to site", title: "Thank you — Bilingual Agents"
    },
    es: {
      head: "¡Gracias! Recibimos tus datos.",
      sub:  "Te llevamos a nuestro calendario para que elijas la hora de tu llamada gratis de 15 minutos…",
      btn:  "Ir al calendario ahora →",
      fine: "¿No te redirige automáticamente? Toca el botón de arriba.",
      back: "← Volver al sitio", title: "Gracias — Bilingual Agents"
    }
  };
  var c = COPY[lang];
  document.documentElement.lang = lang;
  document.title = c.title;
  document.getElementById('t-head').textContent = c.head;
  document.getElementById('t-sub').textContent  = c.sub;
  document.getElementById('cal-btn').textContent = c.btn;
  document.getElementById('t-fine').textContent  = c.fine;
  document.getElementById('back-link').textContent = c.back;

  /* build the Calendly URL, prefilled from the lead we stashed on submit */
  var CALENDLY_URL = "https://calendly.com/business-bilingualagentsgroup/new-meeting";
  var lead = {};
  try { lead = JSON.parse(sessionStorage.getItem("ba_lead") || "{}"); } catch(e){}
  var q = [];
  if (lead && lead.name)  q.push("name="  + encodeURIComponent(String(lead.name).trim()));
  if (lead && lead.email) q.push("email=" + encodeURIComponent(String(lead.email).trim()));
  var url = q.length ? (CALENDLY_URL + "?" + q.join("&")) : CALENDLY_URL;
  document.getElementById('cal-btn').setAttribute('href', url);

  /* GTM/GA4 conversion signal: lead submitted, heading to booking */
  try { window.dataLayer = window.dataLayer || []; window.dataLayer.push({ event: "lead_thank_you" }); } catch(e){}

  /* auto-redirect to Calendly */
  setTimeout(function(){ try { window.location.assign(url); } catch(e){ window.location.href = url; } }, 2200);
})();
</script>
</body>
</html>
